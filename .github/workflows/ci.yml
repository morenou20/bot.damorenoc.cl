name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test
        env:
          # Usar .env.test para tests unitarios
          OPENCODE_API_KEY: test-provider-key-not-used-in-unit-tests
          BOT_INTERNAL_KEY: test-internal-key-not-used-in-unit-tests
